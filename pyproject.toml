[project]
name = "appraisal-ai"
version = "0.1.0"
description = "Appraisal-Grade Valuation AI on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "pyarrow>=17.0.0",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "pypdf>=4.3.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-documentai>=2.30.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-aiplatform>=1.60.0",
    "httpx>=0.27.0",
    "google-cloud-bigquery-connection>=1.23.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "gcp: tests requiring real Google Cloud credentials and resources",
]
